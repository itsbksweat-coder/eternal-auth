# Eternal Auth verification
name: Verify Eternal Auth

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: eternal-auth-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check project
        run: npm run check

      # Deployment is handled by Cloudflare Builds, which is connected directly
      # to this repository's main branch in the Cloudflare dashboard.
