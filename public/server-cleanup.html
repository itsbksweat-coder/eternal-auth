<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#121b36" />
  <title>Eternal Auth • Moderation</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    select { width: 100%; }
    .moderation-actions { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    button:disabled { opacity:.5; cursor:not-allowed; filter:none; }
  </style>
</head>
<body>
  <div class="app-backdrop"></div>
  <main class="page-wrap">
    <section class="content-area">
      <header class="content-topbar card">
        <div>
          <p class="crumb">Eternal Auth / Moderation</p>
          <h1>Ban & Unban</h1>
        </div>
        <div class="toolbar-actions">
          <button id="backBtn" class="ghost" type="button">Back to Dashboard</button>
        </div>
      </header>

      <div id="statusMsg" class="msg"></div>

      <div class="grid two">
        <article class="card panel-card">
          <span class="eyebrow">TARGET SERVER</span>
          <h3>Choose server</h3>
          <div class="stack compact">
            <select id="guildId">
              <option value="1249019782632570971">WakeHub — 1249019782632570971</option>
              <option value="1539142072232050690">CleanHub — 1539142072232050690</option>
            </select>
          </div>
        </article>

        <article class="card panel-card">
          <span class="eyebrow">TARGET USER</span>
          <h3>Discord user ID</h3>
          <div class="stack compact">
            <input id="userId" type="text" inputmode="numeric" autocomplete="off" placeholder="Discord user ID" maxlength="25" />
            <div class="moderation-actions">
              <button id="banBtn" class="danger" type="button" disabled>BAN</button>
              <button id="unbanBtn" class="primary" type="button" disabled>UNBAN</button>
            </div>
          </div>
        </article>
      </div>

      <article class="card panel-card accent-card">
        <span class="eyebrow">LAST ACTION</span>
        <div class="info-grid">
          <div class="info-tile"><span>Server</span><strong id="resultServer">—</strong></div>
          <div class="info-tile"><span>User ID</span><strong id="resultUser">—</strong></div>
          <div class="info-tile"><span>Action</span><strong id="resultAction">—</strong></div>
          <div class="info-tile"><span>Result</span><strong id="resultStatus">—</strong></div>
        </div>
      </article>
    </section>
  </main>

  <script type="module">
    const $ = (s) => document.querySelector(s);

    function message(text = "", type = "") {
      const el = $("#statusMsg");
      el.textContent = text;
      el.className = `msg ${type}`;
    }

    async function api(path, options = {}) {
      const res = await fetch(path, {
        ...options,
        headers: { "content-type": "application/json", ...(options.headers || {}) },
      });
      let data;
      try { data = await res.json(); }
      catch { data = { ok: false, error: `HTTP ${res.status}` }; }
      if (res.status === 401) {
        location.href = "/";
        throw new Error("Sign in to Eternal Auth first.");
      }
      if (!res.ok || data.ok === false) throw new Error(data.error || `HTTP ${res.status}`);
      return data;
    }

    function validUserId() {
      const value = $("#userId").value.replace(/\D/g, "").slice(0, 25);
      $("#userId").value = value;
      return /^\d{5,25}$/.test(value);
    }

    function updateButtons() {
      const valid = validUserId();
      $("#banBtn").disabled = !valid;
      $("#unbanBtn").disabled = !valid;
    }

    async function run(action) {
      const guildId = $("#guildId").value;
      const userId = $("#userId").value.trim();
      if (!validUserId()) return message("Enter a valid Discord user ID.", "error");

      $("#banBtn").disabled = true;
      $("#unbanBtn").disabled = true;
      message(`${action === "ban" ? "Banning" : "Unbanning"} ${userId}…`);

      try {
        const data = await api(`/api/admin/moderation/${action}`, {
          method: "POST",
          body: JSON.stringify({ guild_id: guildId, user_id: userId }),
        });

        $("#resultServer").textContent = `${data.guild_name} — ${data.guild_id}`;
        $("#resultUser").textContent = data.user_id;
        $("#resultAction").textContent = action === "ban" ? "Ban" : "Unban";
        $("#resultStatus").textContent = "Success";
        message(`${action === "ban" ? "Banned" : "Unbanned"} ${data.user_id} in ${data.guild_name}.`, "success");
      } catch (error) {
        $("#resultServer").textContent = $("#guildId").selectedOptions[0]?.textContent || guildId;
        $("#resultUser").textContent = userId;
        $("#resultAction").textContent = action === "ban" ? "Ban" : "Unban";
        $("#resultStatus").textContent = "Failed";
        message(error.message || String(error), "error");
      } finally {
        updateButtons();
      }
    }

    $("#backBtn").onclick = () => { location.href = "/"; };
    $("#userId").addEventListener("input", updateButtons);
    $("#banBtn").onclick = () => run("ban");
    $("#unbanBtn").onclick = () => run("unban");
    updateButtons();
  </script>
</body>
</html>
